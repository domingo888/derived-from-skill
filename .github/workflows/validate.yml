name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验所有制品的契约
        run: |
          for dir in subprojects/*/; do
            echo "== $dir"
            python dfs.py validate "$dir"
          done
